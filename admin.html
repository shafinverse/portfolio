<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Admin | shafin.visuals</title>
<style>:root{--bg:#0b0b0d;--panel:#111114;--line:#2a2a30;--text:#f3f3f2;--muted:#9a9aa3;--accent:#ff7a1a;--aside:rgba(11,11,13,.92);color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.5;padding:24px 18px 120px}
.wrap{max-width:760px;margin:0 auto}
h1{font-size:28px;margin-bottom:6px}h1 span{color:var(--accent)}
p{color:var(--muted);font-size:13px;margin:6px 0}
h3{margin:34px 0 6px;color:var(--accent);font-size:13px;letter-spacing:.1em;text-transform:uppercase}
label{display:block;font-size:12px;color:var(--muted);margin:12px 0 4px}
input[type=text],input[type=password],textarea,select{width:100%;padding:11px 13px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--text);font:inherit;font-size:14px}
textarea{min-height:96px;resize:vertical}
input:focus,textarea:focus,select:focus{outline:0;border-color:var(--accent)}
.li,.cat{padding:12px;margin-top:12px;border:1px solid var(--line);border-radius:14px;background:var(--panel)}
.li{display:flex;gap:12px;align-items:flex-start}
.th{flex:none;width:96px;aspect-ratio:16/9;border-radius:8px;overflow:hidden;background:var(--bg);display:grid;place-items:center;font-size:11px;color:var(--muted)}
.th img,.gi img{width:100%;height:100%;object-fit:cover;display:block}
.fl{flex:1;min-width:0}.fl input[type=text]{margin-bottom:6px}
button,label.fb{display:inline-block;cursor:pointer;border:1px solid var(--accent);background:var(--accent);color:#fff;padding:10px 18px;border-radius:999px;font:inherit;font-size:14px;font-weight:600;margin:0}
button.sec,label.fb.sec,.li>button,.gi button{background:none;color:var(--text);border-color:var(--line)}
.li>button{padding:6px 12px}label.fb.sec{padding:7px 14px;font-size:13px}.fb input{display:none}
button:disabled{opacity:.4;cursor:not-allowed}
.ch{display:flex;gap:8px;align-items:center;margin-bottom:8px}.ch input{flex:1}.ch button{padding:6px 12px}
.tg{font-size:11px;color:var(--accent);border:1px solid var(--line);border-radius:999px;padding:3px 10px}
.gr{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px;margin:10px 0}
.gi{position:relative;aspect-ratio:16/9;border-radius:8px;overflow:hidden}
.gi button{position:absolute;top:4px;right:4px;padding:1px 9px;background:rgba(0,0,0,.7);color:#fff;border:0}
#nc{width:auto;display:inline-block;max-width:240px;margin-right:6px}select{width:auto;display:inline-block}
.bar{position:fixed;left:0;right:0;bottom:0;display:flex;gap:14px;align-items:center;justify-content:center;padding:12px 18px;background:var(--aside);backdrop-filter:blur(10px);border-top:1px solid var(--line)}
#st{font-size:13px;color:var(--muted)}#st.bad{color:#ff6b5e}
</style></head><body>
<div class="wrap"><h1>Admin <span>panel</span></h1><p>Connect your GitHub repo, edit the website content, upload files and press <b>Save</b>.</p><div id="app"></div></div>
<div class="bar"><span id="st">Not connected</span><button id="sv" disabled>Save to GitHub</button></div>
<script>var $=function(s){return document.querySelector(s)};
var C={o:'',r:'',b:'main',t:''};try{C=Object.assign(C,JSON.parse(localStorage.getItem('gh')||'{}'))}catch(e){}
var S=null,SHA=null,pend=[],del=[],PV={},root=$('#app'),st=$('#st');
var G=[['tag','Tagline (small text on top)','t','Hero'],['name','Name (big heading)','t','Hero'],['intro','Intro paragraph','a','Hero'],
['u_deg','University: degree','t','Education'],['u_name','University: name','t','Education'],['u_desc','University: description','a','Education'],
['d_deg','Diploma: degree','t','Education'],['d_name','Diploma: institute','t','Education'],['d_desc','Diploma: description','a','Education'],
['s1','Service 1: title','t','Services'],['s1d','Service 1: text','a','Services'],['s2','Service 2: title','t','Services'],['s2d','Service 2: text','a','Services'],['s3','Service 3: title','t','Services'],['s3d','Service 3: text','a','Services'],
['email','Email address','t','Contact'],['wa','WhatsApp number (with country code)','t','Contact'],['ig','Instagram link','t','Contact'],['fb','Facebook link','t','Contact'],['be','Behance link','t','Contact'],['gh','GitHub link','t','Contact'],['li','LinkedIn link','t','Contact'],['lin','LinkedIn box text','t','Contact']];
function say(m,bad){st.textContent=m;st.className=bad?'bad':''}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;')}
function u2b(s){return btoa(unescape(encodeURIComponent(s)))}
function b2u(b){return decodeURIComponent(escape(atob(b.replace(/\n/g,''))))}
function slug(s){return s.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'cat'}
async function gh(p,m,b){var h={Authorization:'Bearer '+C.t,Accept:'application/vnd.github+json'};if(b)h['Content-Type']='application/json';
var r=await fetch('https://api.github.com/repos/'+C.o+'/'+C.r+(p?'/'+p:''),{method:m||'GET',headers:h,body:b?JSON.stringify(b):undefined});
var j=await r.json().catch(function(){return{}});if(!r.ok){var e=new Error(j.message||('HTTP '+r.status));e.status=r.status;throw e}return j}
function pic(file,max,alpha,cb){var r=new FileReader();r.onload=function(){var i=new Image();i.onload=function(){var s=Math.min(1,max/i.width),c=document.createElement('canvas');c.width=Math.round(i.width*s);c.height=Math.round(i.height*s);c.getContext('2d').drawImage(i,0,0,c.width,c.height);
cb(alpha&&/png|webp|gif/.test(file.type)?c.toDataURL('image/png'):c.toDataURL('image/jpeg',.85))};i.src=r.result};r.readAsDataURL(file)}
function addImg(file,dir,alpha,cb){pic(file,alpha?1400:1400,alpha,function(d){var p=dir+'/'+Date.now()+'-'+Math.random().toString(36).slice(2,6)+(d.indexOf('image/png')>0?'.png':'.jpg');pend.push({p:p,b:d.split(',')[1]});PV[p]=d;cb(p)})}
function src(p){return PV[p]||p}
function rm(p){if(!p)return;var i=pend.findIndex(function(x){return x.p==p});if(i>=0)pend.splice(i,1);else del.push(p)}
function setP(p,v){var a=p.split('.');if(a[0]=='f'){S.f[a[1]]=v;return}var c=S.cats[+a[1]];if(a[2]=='i')c.items[+a[3]][a[4]]=v;else c[a[2]]=v}
function connForm(){return '<h3>GitHub connection</h3><p>Token is saved only in this browser. Use a fine-grained token with <b>Contents: Read and write</b> for this one repo.</p><label>GitHub username / owner</label><input type="text" id="co" value="'+esc(C.o)+'"><label>Repository name</label><input type="text" id="cr" value="'+esc(C.r)+'"><label>Branch</label><input type="text" id="cb" value="'+esc(C.b)+'"><label>Personal access token</label><input type="password" id="ct" value="'+esc(C.t)+'" autocomplete="off"><p><button data-a="conn">Connect &amp; Load</button> <button class="sec" data-a="disc">Disconnect</button></p>'}
function catHtml(c,ci){var h='<div class="cat"><div class="ch"><input type="text" data-b="c.'+ci+'.name" value="'+esc(c.name)+'"><span class="tg">'+(c.type=='video'?'Videos':'Images')+'</span><button class="sec" data-a="up" data-c="'+ci+'">&uarr;</button><button class="sec" data-a="dn" data-c="'+ci+'">&darr;</button><button class="sec" data-a="dc" data-c="'+ci+'">&times;</button></div><input type="text" data-b="c.'+ci+'.d" placeholder="Short description (shown on the folder card)" value="'+esc(c.d||'')+'">';
if(c.type=='video'){h+=c.items.map(function(x,i){return '<div class="li"><div class="th">'+(x.i?'<img src="'+esc(src(x.i))+'">':'<span>no image</span>')+'</div><div class="fl"><input type="text" data-b="c.'+ci+'.i.'+i+'.t" placeholder="Title" value="'+esc(x.t)+'"><input type="text" data-b="c.'+ci+'.i.'+i+'.u" placeholder="YouTube link" value="'+esc(x.u)+'"><label class="fb sec">Choose thumbnail<input type="file" accept="image/*" data-up="v.'+ci+'.'+i+'"></label></div><button data-a="di" data-c="'+ci+'" data-i="'+i+'">&times;</button></div>'}).join('')+'<p><button class="sec" data-a="av" data-c="'+ci+'">+ Add video</button></p>'}
else{h+='<div class="gr">'+c.items.map(function(x,i){return '<div class="gi"><img src="'+esc(src(x.i))+'"><button data-a="di" data-c="'+ci+'" data-i="'+i+'">&times;</button></div>'}).join('')+'</div><p><label class="fb sec">+ Add images<input type="file" accept="image/*" multiple data-up="g.'+ci+'"></label></p>'}
return h+'</div>'}
function draw(){var y=window.scrollY,h=connForm();if(S){var g='';G.forEach(function(f){if(f[3]!=g){g=f[3];h+='<h3>'+g+'</h3>'}var v=S.f[f[0]]==null?'':S.f[f[0]];h+='<label>'+f[1]+'</label>'+(f[2]=='a'?'<textarea data-b="f.'+f[0]+'">'+esc(v)+'</textarea>':'<input type="text" data-b="f.'+f[0]+'" value="'+esc(v)+'">')});
h+='<h3>Images</h3>'+[['profile','Profile photo (transparent PNG / WebP works best)'],['uniLogo','University logo'],['dipLogo','Diploma / college logo']].map(function(a){var p=S.assets[a[0]];return '<div class="li"><div class="th">'+(p?'<img src="'+esc(src(p))+'">':'')+'</div><div class="fl"><label>'+a[1]+'</label><label class="fb sec">Choose image<input type="file" accept="image/*" data-up="a.'+a[0]+'"></label></div></div>'}).join('');
h+='<h3>Categories (folders on the website)</h3>'+S.cats.map(catHtml).join('')+'<p><input type="text" id="nc" placeholder="New category name"><select id="nt"><option value="image">Images</option><option value="video">Videos</option></select> <button class="sec" data-a="ac">+ Add category</button></p>'}
root.innerHTML=h;window.scrollTo(0,y);$('#sv').disabled=!S}
async function conn(){C={o:$('#co').value.trim(),r:$('#cr').value.trim(),b:$('#cb').value.trim()||'main',t:$('#ct').value.replace(/\s+/g,'').replace(/^Bearer/i,'')};localStorage.setItem('gh',JSON.stringify(C));
say('Step 1/3: reaching GitHub...');
try{await fetch('https://api.github.com/zen')}catch(e){console.error(e);say('Step 1 failed: this browser cannot reach api.github.com. Turn off the ad blocker / shields / VPN for this site, or try Incognito, another browser or another network.',1);return}
say('Step 2/3: checking token and repo...');
try{var rp=await gh('');if(rp.permissions&&!rp.permissions.push)throw new Error('This token cannot write to the repo. Give it Contents: Read and write.');
say('Step 3/3: loading content...');
try{var j=await gh('contents/data/content.json?ref='+C.b);S=JSON.parse(b2u(j.content));SHA=j.sha}catch(e){if(e.status!=404)throw e;S={f:{},assets:{},cats:[]};SHA=null}
S.f=S.f||{};S.assets=S.assets||{};S.cats=S.cats||[];pend=[];del=[];say('Connected: '+C.o+'/'+C.r+' ('+C.b+')');draw()}
catch(e){console.error(e);var m=e.message;if(e.status==401)m='Token is invalid or expired (401). Create a new token.';else if(e.status==404)m='Repo "'+C.o+'/'+C.r+'" or branch "'+C.b+'" not found, or the token has no access to it (404).';else if(e.status==403)m='GitHub refused the request (403): '+e.message;say('Could not connect: '+m,1)}}
async function save(){if(!S)return;var n=pend.length;try{
for(var i=0;i<n;i++){say('Uploading image '+(i+1)+' of '+n+'...');await gh('contents/'+pend[i].p,'PUT',{message:'Upload '+pend[i].p,content:pend[i].b,branch:C.b})}
for(var k=0;k<del.length;k++){say('Removing old files...');try{var d=await gh('contents/'+del[k]+'?ref='+C.b);await gh('contents/'+del[k],'DELETE',{message:'Remove '+del[k],sha:d.sha,branch:C.b})}catch(e){}}
say('Saving content...');try{var cur=await gh('contents/data/content.json?ref='+C.b);SHA=cur.sha}catch(e){SHA=null}
var body={message:'Update website content',content:u2b(JSON.stringify(S,null,1)),branch:C.b};if(SHA)body.sha=SHA;var r=await gh('contents/data/content.json','PUT',body);SHA=r.content.sha;pend=[];del=[];
say('Saved! The website updates in about a minute (GitHub Pages).')}catch(e){say('Save failed: '+e.message,1)}}
root.addEventListener('input',function(e){var b=e.target.dataset&&e.target.dataset.b;if(b&&S)setP(b,e.target.value)});
root.addEventListener('change',function(e){var t=e.target,fs=t.files,u=t.dataset&&t.dataset.up;if(!u||!fs||!fs.length)return;var a=u.split('.');
if(a[0]=='a'){addImg(fs[0],'assets',true,function(p){rm(S.assets[a[1]]);S.assets[a[1]]=p;draw()})}
else if(a[0]=='v'){var it=S.cats[+a[1]].items[+a[2]];addImg(fs[0],'uploads/'+S.cats[+a[1]].id,false,function(p){rm(it.i);it.i=p;draw()})}
else if(a[0]=='g'){var c=S.cats[+a[1]],n=fs.length;[].slice.call(fs).forEach(function(f){addImg(f,'uploads/'+c.id,false,function(p){c.items.push({i:p});if(--n==0)draw()})})}});
root.addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;var a=b.dataset.a,c=+b.dataset.c,i=+b.dataset.i;
if(a=='conn')conn();else if(a=='disc'){localStorage.removeItem('gh');C.t='';S=null;say('Disconnected');draw()}
else if(a=='ac'){var nm=$('#nc').value.trim();if(!nm)return;S.cats.push({id:slug(nm)+'-'+Math.random().toString(36).slice(2,5),name:nm,type:$('#nt').value,d:'',items:[]});draw()}
else if(a=='dc'){if(!confirm('Delete this category and all its files?'))return;S.cats[c].items.forEach(function(x){rm(x.i)});S.cats.splice(c,1);draw()}
else if(a=='up'&&c>0){S.cats.splice(c-1,0,S.cats.splice(c,1)[0]);draw()}else if(a=='dn'&&c<S.cats.length-1){S.cats.splice(c+1,0,S.cats.splice(c,1)[0]);draw()}
else if(a=='di'){rm(S.cats[c].items[i].i);S.cats[c].items.splice(i,1);draw()}
else if(a=='av'){S.cats[c].items.push({t:'New video',u:'https://youtu.be/',i:''});draw()}});
$('#sv').addEventListener('click',save);draw();if(C.t&&C.o&&C.r)conn();
</script></body></html>
