async function conn(){C={o:$('#co').value.trim(),r:$('#cr').value.trim(),b:$('#cb').value.trim()||'main',t:$('#ct').value.replace(/\s+/g,'').replace(/^Bearer/i,'')};localStorage.setItem('gh',JSON.stringify(C));var ls=$('#ls'),btn=$('#cn');btn.disabled=true;
function lsay(m,bad){ls.textContent=m;ls.className=bad?'bad':''}lsay('Reaching GitHub...');
try{await fetch('https://api.github.com/zen')}catch(e){console.error(e);lsay('This browser cannot reach api.github.com. Turn off the ad blocker / shields / VPN for this site, or try Incognito, another browser or network.',1);btn.disabled=false;return}
try{lsay('Checking token and repo...');var rp=await gh('');if(rp.permissions&&!rp.permissions.push)throw new Error('This token cannot write to the repo. Give it Contents: Read and write.');
lsay('Loading content...');var raw=null;try{var j=await gh('contents/data/content.json?ref='+C.b);raw=JSON.parse(b2u(j.content));SHA=j.sha}catch(e){if(e.status!=404)throw e;SHA=null}
S=migrate(raw);pend=[];del=[];dirty=false;$('#sv').classList.remove('dirty');$('#rp').textContent=C.o+'/'+C.r;say('Connected');TAB='gen';show(true);draw();if(!raw||!raw.v)mark()}
catch(e){console.error(e);var m=e.message;if(e.status==401)m='Token is invalid or expired (401). Create a new token.';else if(e.status==404)m='Repo "'+C.o+'/'+C.r+'" or branch "'+C.b+'" not found, or the token has no access to it (404).';else if(e.status==403)m='GitHub refused the request (403): '+e.message;lsay('Could not connect: '+m,1)}btn.disabled=false}
async function save(){if(!S||busy)return;busy=true;var b=$('#sv'),n=pend.length;b.disabled=true;
try{for(var i=0;i<n;i++){say('Uploading image '+(i+1)+' of '+n+'...');await gh('contents/'+pend[i].p,'PUT',{message:'Upload '+pend[i].p,content:pend[i].b,branch:C.b})}
for(var k=0;k<del.length;k++){say('Removing old files...');try{var d=await gh('contents/'+del[k]+'?ref='+C.b);await gh('contents/'+del[k],'DELETE',{message:'Remove '+del[k],sha:d.sha,branch:C.b})}catch(e){}}
say('Saving content...');try{SHA=(await gh('contents/data/content.json?ref='+C.b)).sha}catch(e){SHA=null}
var body={message:'Update website content',content:u2b(JSON.stringify(S,null,1)),branch:C.b};if(SHA)body.sha=SHA;var r=await gh('contents/data/content.json','PUT',body);SHA=r.content.sha;pend=[];del=[];dirty=false;b.classList.remove('dirty');
say('\u2713 Saved');toast('Saved! The website updates in about a minute.')}catch(e){say('Save failed',1);toast('Save failed: '+e.message,1)}b.disabled=false;busy=false}
/* ---------- events ---------- */
$('#tabs').addEventListener('click',function(e){var b=e.target.closest('[data-t]');if(b){TAB=b.dataset.t;draw()}});
pane.addEventListener('input',function(e){var b=e.target.dataset&&e.target.dataset.b;if(b&&S){set(b,e.target.value);mark();if(b.indexOf('.name')>0&&b.indexOf('cats')==0)$('#tabs [data-t="'+TAB+'"]').lastChild.textContent=e.target.value}});
pane.addEventListener('change',function(e){var t=e.target,fs=t.files,u=t.dataset&&t.dataset.up;if(!u||!fs||!fs.length)return;
if(t.dataset.many){var a=arr(u),n=fs.length;[].slice.call(fs).forEach(function(f){addImg(f,t.dataset.dir,false,function(p){a.push({i:p});if(--n==0){mark();draw()}},function(){if(--n==0){mark();draw()}})})}
else addImg(fs[0],t.dataset.dir,!!t.dataset.alpha,function(p){rm(get(u));set(u,p);mark();draw()})});
pane.addEventListener('click',function(e){var b=e.target.closest('button[data-a]');if(!b||b.disabled)return;var a=b.dataset.a,p=b.dataset.p,i=+b.dataset.i,c=+b.dataset.c;
if(a=='add'){var key=p.split('.')[0],o=key=='cats'?(S.cats[+p.split('.')[1]].type=='video'?{t:'New video',u:'https://youtu.be/',i:''}:{i:''}):clone(NEWI[key]);arr(p).push(o)}
else if(a=='del'){if(!confirm('Delete this item?'))return;var l=arr(p);rmItem(l[i]);l.splice(i,1)}
else if(a=='mvu'){var l=arr(p);l.splice(i-1,0,l.splice(i,1)[0])}else if(a=='mvd'){var l=arr(p);l.splice(i+1,0,l.splice(i,1)[0])}
else if(a=='cl'){S.cats.splice(c-1,0,S.cats.splice(c,1)[0]);TAB='c'+(c-1)}else if(a=='cr'){S.cats.splice(c+1,0,S.cats.splice(c,1)[0]);TAB='c'+(c+1)}
else if(a=='dc'){if(!confirm('Delete this category and all its files?'))return;S.cats[c].items.forEach(rmItem);S.cats.splice(c,1);TAB='gen'}
else if(a=='ac'){var nm=$('#nc').value.trim();if(!nm){toast('Enter a category name',1);return}S.cats.push({id:slug(nm)+'-'+Math.random().toString(36).slice(2,5),name:nm,type:$('#nt').value,d:'',items:[]});TAB='c'+(S.cats.length-1)}
mark();draw()});
$('#cn').addEventListener('click',conn);$('#sv').addEventListener('click',save);
$('#lo').addEventListener('click',function(){if(dirty&&!confirm('You have unsaved changes. Disconnect anyway?'))return;localStorage.removeItem('gh');C.t='';S=null;dirty=false;$('#ct').value='';$('#ls').textContent='';show(false)});
window.addEventListener('beforeunload',function(e){if(dirty){e.preventDefault();e.returnValue=''}});
['co','cr','cb','ct'].forEach(function(k){var e=$('#'+k);e.value=C[k.slice(1)]||'';e.addEventListener('keydown',function(ev){if(ev.key=='Enter')conn()})});
if(C.t&&C.o&&C.r)conn();
</script></body></html>
