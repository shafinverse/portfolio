<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Admin | shafin.visuals</title>
<style>
:root{--bg:#0b0b0d;--pn:#131316;--p2:#1b1b20;--ln:#2a2a31;--tx:#f3f3f2;--mu:#9a9aa3;--ac:#ff7a1a;--ok:#2ecc71;--bad:#ff5a4d;color-scheme:dark}
[data-theme=light]{--bg:#f1efeb;--pn:#fbfaf8;--p2:#ece9e4;--ln:#dcd8d1;--tx:#1d1d22;--mu:#6c6c78;color-scheme:light}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--tx);font:14px/1.5 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background-image:linear-gradient(var(--ln) 1px,transparent 1px),linear-gradient(90deg,var(--ln) 1px,transparent 1px);background-size:46px 46px;background-attachment:fixed}
.hide{display:none!important}
.app{display:grid;grid-template-columns:260px 1fr;min-height:100vh}
aside{position:sticky;top:0;height:100vh;overflow:auto;background:var(--pn);border-right:1px solid var(--ln);padding:16px 12px;display:flex;flex-direction:column;gap:3px}
.br{font-weight:700;font-size:17px;padding:2px 10px 12px}.br b{color:var(--ac)}.br small{color:var(--mu);font-weight:500;margin-left:6px}
.gh{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--mu);padding:12px 10px 4px}
.nv{all:unset;box-sizing:border-box;cursor:pointer;display:flex;justify-content:space-between;gap:8px;padding:9px 12px;border-radius:10px;color:var(--mu);transition:.15s}
.nv span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.nv em{font-style:normal;font-size:11px;background:var(--p2);border-radius:99px;padding:1px 8px;align-self:center}
.nv:hover{background:var(--p2);color:var(--tx)}.nv.on{background:color-mix(in srgb,var(--ac) 16%,transparent);color:var(--ac);font-weight:600}
.sp{flex:1;min-height:12px}
main{padding:0 28px 100px;max-width:980px;width:100%}
.bar{position:sticky;top:0;z-index:5;display:flex;gap:10px;align-items:center;padding:14px 0;background:color-mix(in srgb,var(--bg) 84%,transparent);backdrop-filter:blur(12px)}
#st{flex:1;font-size:13px;color:var(--mu);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}#st.bad{color:var(--bad)}
.chip{font-size:12px;padding:4px 11px;border-radius:99px;border:1px solid var(--ln);background:var(--pn);color:var(--mu)}.chip.d{color:var(--ac);border-color:var(--ac)}
h2{font-size:24px;margin:10px 0 2px}.sub{color:var(--mu);margin-bottom:18px}
label.l{display:block;font-size:12px;color:var(--mu);margin:0 0 5px}
.f{margin-bottom:14px}
input[type=text],input[type=password],textarea{width:100%;background:var(--p2);color:var(--tx);border:1px solid var(--ln);border-radius:10px;padding:10px 12px;font:inherit;outline:0;transition:.15s}
textarea{min-height:92px;resize:vertical}
input:focus,textarea:focus{border-color:var(--ac);box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 20%,transparent)}
.btn,label.btn{display:inline-block;cursor:pointer;border:1px solid var(--ln);background:var(--p2);color:var(--tx);border-radius:10px;padding:9px 15px;font:inherit;font-weight:600;text-decoration:none;text-align:center;transition:.15s;white-space:nowrap}
.btn:hover{border-color:var(--ac)}.btn.pri{background:var(--ac);border-color:var(--ac);color:#fff}.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.sm{padding:5px 10px;font-size:12px}.btn.dng:hover{border-color:var(--bad);color:var(--bad)}label.btn input{display:none}
.card{background:var(--pn);border:1px solid var(--ln);border-radius:14px;padding:16px;margin-bottom:16px}
.row{display:flex;gap:10px;align-items:center}.row>.f{flex:1}
.tag{font-size:11px;color:var(--ac);border:1px solid var(--ln);border-radius:99px;padding:3px 10px}
.gr{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;padding:6px;border-radius:12px;border:2px dashed transparent;transition:.15s}.gr.drag{border-color:var(--ac);background:color-mix(in srgb,var(--ac) 8%,transparent)}
.gi{position:relative;aspect-ratio:16/9;border-radius:10px;overflow:hidden;border:1px solid var(--ln);background:var(--p2)}
.gi img{width:100%;height:100%;object-fit:cover;display:block}
.ga{position:absolute;inset:auto 0 0 0;display:flex;gap:4px;justify-content:center;padding:6px;background:linear-gradient(transparent,rgba(0,0,0,.75));opacity:0;transition:.15s}.gi:hover .ga,.gi:focus-within .ga{opacity:1}
.ga button{all:unset;cursor:pointer;color:#fff;background:rgba(255,255,255,.18);border-radius:6px;padding:2px 9px;font-size:12px}.ga button:hover{background:var(--bad)}
.dz{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;aspect-ratio:16/9;border:2px dashed var(--ln);border-radius:10px;color:var(--mu);cursor:pointer;font-weight:600;text-align:center;font-size:12px}.dz:hover{border-color:var(--ac);color:var(--ac)}
.vi{display:flex;gap:14px;align-items:flex-start;padding:12px;border:1px solid var(--ln);border-radius:12px;background:var(--p2);margin-bottom:12px}
.th{flex:none;width:150px;aspect-ratio:16/9;border-radius:8px;overflow:hidden;background:var(--bg);display:grid;place-items:center;font-size:11px;color:var(--mu)}.th img{width:100%;height:100%;object-fit:cover}
.fl{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}.acts{display:flex;gap:6px;flex-wrap:wrap}
.opt{flex:1;cursor:pointer;padding:16px;border:2px solid var(--ln);border-radius:12px;background:var(--p2);text-align:left;color:var(--tx);font:inherit}.opt.on{border-color:var(--ac)}.opt b{display:block}.opt span{color:var(--mu);font-size:12px}
#lg{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}#lg .card{max-width:430px;width:100%;padding:26px}
#lg p{color:var(--mu);font-size:13px;margin:4px 0 14px}#le{color:var(--bad);min-height:22px;margin:6px 0;font-size:13px}
#toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,30px);opacity:0;background:var(--tx);color:var(--bg);padding:11px 18px;border-radius:12px;font-weight:600;transition:.25s;z-index:30;pointer-events:none}#toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:820px){.app{grid-template-columns:1fr}aside{position:static;height:auto;flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--ln);padding:10px;align-items:center}.gh,.br,.sp{display:none}.nv{white-space:nowrap}aside .btn{flex:none}main{padding:0 14px 100px}.vi{flex-direction:column}.th{width:100%}.row{flex-wrap:wrap}}
</style></head><body>
<div id="lg"></div>
<div class="app hide" id="app">
<aside><div class="br">shafin<b>.visuals</b><small>admin</small></div><div id="nav" style="display:contents"></div><div class="sp"></div>
<a class="btn sm" href="./" target="_blank">View site ↗</a><button class="btn sm" id="th">Theme ◐</button><button class="btn sm dng" id="out">Disconnect</button></aside>
<main><div class="bar"><span id="st">Not connected</span><span class="chip" id="dc">All saved</span><button class="btn" id="ds">Discard</button><button class="btn pri" id="sv" disabled>Save to GitHub</button></div><div id="view"></div></main></div>
<div id="toast"></div>
<script>
const $=s=>document.querySelector(s);
const h=(t,a={},...c)=>{const e=document.createElement(t);for(const k in a){const v=a[k];if(k.startsWith('on'))e.addEventListener(k.slice(2),v);else if(v!=null&&v!==false)e.setAttribute(k,v===true?'':v)}c.flat(9).forEach(x=>{if(x==null||x===false)return;e.append(x.nodeType?x:document.createTextNode(x))});return e};
let C=Object.assign({o:'',r:'',b:'main',t:''},JSON.parse(localStorage.getItem('gh')||'{}')),S=null,SHA=null,orig='',pend=[],del=[],PV={},cur='hero',newType='image';
const G=[['tag','Tagline (small text on top)','t','hero'],['name','Name (big heading)','t','hero'],['intro','Intro paragraph','a','hero'],
['u_deg','University: degree','t','education'],['u_name','University: name','t','education'],['u_desc','University: description','a','education'],
['d_deg','Diploma: degree','t','education'],['d_name','Diploma: institute','t','education'],['d_desc','Diploma: description','a','education'],
['s1','Service 1: title','t','services'],['s1d','Service 1: text','a','services'],['s2','Service 2: title','t','services'],['s2d','Service 2: text','a','services'],['s3','Service 3: title','t','services'],['s3d','Service 3: text','a','services'],
['email','Email address','t','contact'],['wa','WhatsApp number (with country code)','t','contact'],['ig','Instagram link','t','contact'],['fb','Facebook link','t','contact'],['be','Behance link','t','contact'],['gh','GitHub link','t','contact'],['li','LinkedIn link','t','contact'],['lin','LinkedIn box text','t','contact']];
const T=[['hero','Hero','Name, tagline and intro'],['education','Education','University and diploma'],['services','Services','The three service cards'],['contact','Contact','Email, WhatsApp and social links'],['images','Site images','Profile photo and logos']];
const say=(m,bad)=>{const s=$('#st');s.textContent=m;s.className=bad?'bad':''};
const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),2600)};
const u2b=s=>btoa(unescape(encodeURIComponent(s))),b2u=b=>decodeURIComponent(escape(atob(b.replace(/\n/g,''))));
const slug=s=>s.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'cat';
const ytId=u=>(String(u||'').match(/(?:youtu\.be\/|v=|embed\/|shorts\/)([\w-]{11})/)||[])[1];
const ytThumb=u=>'https://img.youtube.com/vi/'+ytId(u)+'/hqdefault.jpg';
const src=p=>PV[p]||p;
const isDirty=()=>!!S&&(JSON.stringify(S)!==orig||pend.length>0||del.length>0);
function dirty(){const d=isDirty(),c=$('#dc');c.classList.toggle('d',d);c.textContent=d?'● Unsaved changes'+(pend.length?' · '+pend.length+' new file(s)':''):'All saved';$('#sv').disabled=!d}
addEventListener('beforeunload',e=>{if(isDirty()){e.preventDefault();e.returnValue=''}});

async function gh(p,m,b){const r=await fetch('https://api.github.com/repos/'+C.o+'/'+C.r+'/'+p,{method:m||'GET',headers:{Authorization:'Bearer '+C.t,Accept:'application/vnd.github+json','Content-Type':'application/json'},body:b?JSON.stringify(b):undefined});
const j=await r.json().catch(()=>({}));if(!r.ok){const e=new Error(j.message||('HTTP '+r.status));e.status=r.status;throw e}return j}
function pic(file,alpha,cb){const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const s=Math.min(1,1400/i.width),c=document.createElement('canvas');c.width=Math.round(i.width*s);c.height=Math.round(i.height*s);c.getContext('2d').drawImage(i,0,0,c.width,c.height);cb(alpha&&/png|webp|gif/.test(file.type)?c.toDataURL('image/png'):c.toDataURL('image/jpeg',.85))};i.src=r.result};r.readAsDataURL(file)}
const add=(file,dir,alpha)=>new Promise(res=>pic(file,alpha,d=>{const p=dir+'/'+Date.now()+'-'+Math.random().toString(36).slice(2,6)+(d.indexOf('image/png')>0?'.png':'.jpg');pend.push({p,b:d.split(',')[1]});PV[p]=d;res(p)}));
function rm(p){if(!p||/^(https?:|data:)/.test(p))return;const i=pend.findIndex(x=>x.p==p);if(i>=0)pend.splice(i,1);else del.push(p)}
const pick=(multi,cb)=>{const i=h('input',{type:'file',accept:'image/*',multiple:multi});i.onchange=()=>{if(i.files.length)cb([...i.files])};i.click()};
const isImgFile=f=>/^image\//.test(f.type);
const mv=(a,i,d)=>{const j=i+d;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];dirty();draw()};
const getCat=()=>S.cats.find(c=>'c:'+c.id===cur);

/* ---------- views ---------- */
function nb(id,label,n,type){return h('button',{class:'nv'+(cur===id?' on':''),onclick:()=>{cur=id;draw();scrollTo(0,0)}},h('span',{},(type?(type=='video'?'▶  ':'▣  '):'')+label),n!=null&&h('em',{},n))}
function nav(){$('#nav').replaceChildren(h('div',{class:'gh'},'Site'),...T.map(t=>nb(t[0],t[1])),h('div',{class:'gh'},'Categories'),...S.cats.map(c=>nb('c:'+c.id,c.name||'Untitled',c.items.length,c.type)),nb('new','+ New category'))}
function head(t,s){return[h('h2',{},t),h('p',{class:'sub'},s)]}
function fieldsView(id){
  const t=T.find(x=>x[0]===id);
  return[...head(t[1],t[2]),h('div',{class:'card'},G.filter(f=>f[3]===id).map(f=>{
    const v=S.f[f[0]]==null?'':S.f[f[0]];
    const el=f[2]=='a'?h('textarea',{},v):h('input',{type:'text',value:v});
    el.addEventListener('input',()=>{S.f[f[0]]=el.value;dirty()});
    return h('div',{class:'f'},h('label',{class:'l'},f[1]),el)}))];
}
function imagesView(){
  return[...head('Site images','Profile photo and logos. Transparent PNG / WebP works best for the profile photo.'),
    ...[['profile','Profile photo'],['uniLogo','University logo'],['dipLogo','Diploma / college logo']].map(a=>{
      const p=S.assets[a[0]];
      return h('div',{class:'card row'},h('div',{class:'th',style:'width:110px'},p?h('img',{src:src(p)}):'none'),
        h('div',{class:'fl'},h('b',{},a[1]),h('div',{class:'acts'},h('button',{class:'btn sm',onclick:()=>pick(false,async fs=>{toast('Processing…');const np=await add(fs[0],'assets',true);rm(S.assets[a[0]]);S.assets[a[0]]=np;dirty();draw()})},p?'Change image':'Choose image'))))})];
}
async function addAll(files,c){files=files.filter(isImgFile);if(!files.length)return;toast('Processing '+files.length+' image(s)…');for(const f of files)c.items.push({i:await add(f,'uploads/'+c.id,false)});dirty();draw()}
function catHead(c){
  const nm=h('input',{type:'text',value:c.name||'',placeholder:'Category name'}),ds=h('input',{type:'text',value:c.d||'',placeholder:'Short description (shown on the folder card)'});
  nm.addEventListener('input',()=>{c.name=nm.value;dirty()});nm.addEventListener('change',nav);
  ds.addEventListener('input',()=>{c.d=ds.value;dirty()});
  return h('div',{class:'card'},h('div',{class:'row'},h('div',{class:'f'},h('label',{class:'l'},'Folder name'),nm),h('span',{class:'tag'},c.type=='video'?'Videos':'Images'),
    h('button',{class:'btn sm dng',onclick:()=>{if(!confirm('Delete "'+c.name+'" and all its files?'))return;c.items.forEach(x=>rm(x.i));S.cats.splice(S.cats.indexOf(c),1);cur='hero';dirty();draw()}},'Delete category')),
    h('div',{class:'f',style:'margin:0'},h('label',{class:'l'},'Description'),ds));
}
function galleryView(c){
  const g=h('div',{class:'gr'},c.items.map((x,i)=>h('div',{class:'gi'},h('img',{src:src(x.i),loading:'lazy'}),
    h('div',{class:'ga'},h('button',{title:'Move left',onclick:()=>mv(c.items,i,-1)},'◀'),h('button',{title:'Move right',onclick:()=>mv(c.items,i,1)},'▶'),h('button',{title:'Remove',onclick:()=>{rm(x.i);c.items.splice(i,1);dirty();draw()}},'✕')))),
    h('div',{class:'dz',onclick:()=>pick(true,fs=>addAll(fs,c))},h('span',{},'+ Add images'),h('span',{style:'font-weight:400'},'or drop files here')));
  g.addEventListener('dragover',e=>{e.preventDefault();g.classList.add('drag')});g.addEventListener('dragleave',()=>g.classList.remove('drag'));
  g.addEventListener('drop',e=>{e.preventDefault();g.classList.remove('drag');addAll([...e.dataTransfer.files],c)});
  return h('div',{class:'card'},h('p',{class:'sub',style:'margin-bottom:10px'},c.items.length+' image(s). Hover an image to reorder or remove it.'),g);
}
function videosView(c){
  return h('div',{class:'card'},c.items.map((x,i)=>{
    const pv=h('div',{class:'th'},x.i?h('img',{src:src(x.i)}):'no thumbnail');
    const setI=p=>{rm(x.i);x.i=p;pv.replaceChildren(p?h('img',{src:src(p)}):'no thumbnail');dirty()};
    const t=h('input',{type:'text',placeholder:'Video title',value:x.t||'',oninput:e=>{x.t=e.target.value;dirty()}});
    const u=h('input',{type:'text',placeholder:'YouTube link',value:x.u||'',oninput:e=>{x.u=e.target.value;dirty()},onchange:()=>{if(!x.i&&ytId(x.u))setI(ytThumb(x.u))}});
    return h('div',{class:'vi'},pv,h('div',{class:'fl'},t,u,h('div',{class:'acts'},
      h('button',{class:'btn sm',onclick:()=>pick(false,async fs=>{toast('Processing…');setI(await add(fs[0],'uploads/'+c.id,false))})},'Upload thumbnail'),
      h('button',{class:'btn sm',onclick:()=>{if(ytId(x.u))setI(ytThumb(x.u));else toast('Paste a valid YouTube link first')}},'Use YouTube thumbnail'),
      x.u&&h('a',{class:'btn sm',href:x.u,target:'_blank',rel:'noopener'},'Open ↗'),
      h('button',{class:'btn sm',onclick:()=>mv(c.items,i,-1)},'↑'),h('button',{class:'btn sm',onclick:()=>mv(c.items,i,1)},'↓'),
      h('button',{class:'btn sm dng',onclick:()=>{rm(x.i);c.items.splice(i,1);dirty();draw()}},'✕'))))}),
    h('button',{class:'btn',onclick:()=>{c.items.push({t:'',u:'',i:''});dirty();draw()}},'+ Add video'));
}
function newView(){
  const nm=h('input',{type:'text',placeholder:'e.g. Short Films'});
  const o=(ty,t,d)=>h('button',{class:'opt'+(newType===ty?' on':''),onclick:()=>{newType=ty;draw()}},h('b',{},t),h('span',{},d));
  return[...head('New category','Each category becomes a folder card on your website and gets its own tab here.'),
    h('div',{class:'card'},h('div',{class:'f'},h('label',{class:'l'},'Category name'),nm),
      h('div',{class:'row',style:'margin-bottom:16px'},o('image','▣  Images','Thumbnails, designs, photos'),o('video','▶  Videos','YouTube links with thumbnails')),
      h('button',{class:'btn pri',onclick:()=>{const n=nm.value.trim();if(!n)return toast('Enter a name');const c={id:slug(n)+'-'+Math.random().toString(36).slice(2,5),name:n,type:newType,d:'',items:[]};S.cats.push(c);cur='c:'+c.id;dirty();draw()}},'Create category'))];
}
function draw(){
  if(!S){$('#app').classList.add('hide');$('#lg').classList.remove('hide');return}
  $('#lg').classList.add('hide');$('#app').classList.remove('hide');nav();
  const y=scrollY,v=$('#view');let c=getCat();
  if(cur.startsWith('c:')&&!c)cur='hero';
  if(c)v.replaceChildren(...head(c.name||'Untitled',c.type=='video'?'Video folder':'Image folder'),catHead(c),c.type=='video'?videosView(c):galleryView(c));
  else if(cur==='new')v.replaceChildren(...newView());
  else if(cur==='images')v.replaceChildren(...imagesView());
  else v.replaceChildren(...fieldsView(cur));
  scrollTo(0,y);dirty();
}

/* ---------- connect / save ---------- */
function loginView(){
  const i=(id,l,v,t)=>h('div',{class:'f'},h('label',{class:'l'},l),h('input',{type:t||'text',id,value:v,autocomplete:'off'}));
  $('#lg').replaceChildren(h('div',{class:'card'},h('div',{class:'br',style:'padding:0 0 6px'},'shafin',h('b',{},'.visuals'),h('small',{},'admin')),
    h('p',{},'Connect your GitHub repo. The token is saved only in this browser (fine-grained token, Contents: Read and write).'),
    i('co','GitHub username / owner',C.o),i('cr','Repository name',C.r),i('cb','Branch',C.b),i('ct','Personal access token',C.t,'password'),
    h('div',{id:'le'}),h('button',{class:'btn pri',style:'width:100%',onclick:()=>conn({o:$('#co').value.trim(),r:$('#cr').value.trim(),b:$('#cb').value.trim()||'main',t:$('#ct').value.trim()})},'Connect & Load')));
}
async function conn(c){
  C=c;localStorage.setItem('gh',JSON.stringify(C));say('Connecting...');const le=$('#le');if(le)le.textContent='Connecting…';
  try{
    const rp=await gh('');if(rp.permissions&&!rp.permissions.push)throw new Error('This token cannot write to the repo');
    try{const j=await gh('contents/data/content.json?ref='+C.b);S=JSON.parse(b2u(j.content));SHA=j.sha}catch(e){if(e.status!=404)throw e;S={f:{},assets:{},cats:[]};SHA=null}
    S.f=S.f||{};S.assets=S.assets||{};S.cats=S.cats||[];pend=[];del=[];orig=JSON.stringify(S);
    say('Connected: '+C.o+'/'+C.r+' ('+C.b+')');draw();
  }catch(e){S=null;say('Could not connect: '+e.message,1);draw();const l=$('#le');if(l)l.textContent='Could not connect: '+e.message}
}
async function save(){
  if(!S)return;const n=pend.length;$('#sv').disabled=true;
  try{
    for(let i=0;i<n;i++){say('Uploading image '+(i+1)+' of '+n+'...');await gh('contents/'+pend[i].p,'PUT',{message:'Upload '+pend[i].p,content:pend[i].b,branch:C.b})}
    for(const p of del){say('Removing old files...');try{const d=await gh('contents/'+p+'?ref='+C.b);await gh('contents/'+p,'DELETE',{message:'Remove '+p,sha:d.sha,branch:C.b})}catch(e){}}
    say('Saving content...');try{SHA=(await gh('contents/data/content.json?ref='+C.b)).sha}catch(e){SHA=null}
    const body={message:'Update website content',content:u2b(JSON.stringify(S,null,1)),branch:C.b};if(SHA)body.sha=SHA;
    const r=await gh('contents/data/content.json','PUT',body);SHA=r.content.sha;pend=[];del=[];orig=JSON.stringify(S);
    say('Saved! The website updates in about a minute.');toast('Saved ✓');
  }catch(e){say('Save failed: '+e.message,1)}
  dirty();
}
$('#sv').onclick=save;
